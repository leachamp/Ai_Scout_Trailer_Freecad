00000001" width="8" height="8" fill="#603e24" /><rect x="234.23999999999998" y="844.2" width="8" height="8" fill="#603e24" /><rect x="152.7" y="844.2" width="8" height="8" fill="#603e24" /><rect x="113.5" y="338.37979" width="186.03" height="248.96349" fill="#fdd" fill-opacity="0.7" stroke="#b33" stroke-dasharray="5 4" /><rect x="255.25" y="346.0" width="164.70000000000002" height="540.0" fill="#d9f1dc" stroke="#398052" fill-opacity="0.7" stroke-dasharray="5 4" /><rect x="440.2" y="410.8" width="145.8" height="216.0" fill="#f3d254" stroke="#665417" /><text x="449" y="535" fill="#18232c" font-family="sans-serif" font-size="16">27 gal</text><text x="288" y="710" fill="#18232c" font-family="sans-serif" font-size="15">610 clear</text><text x="665" y="180" fill="#18232c" font-family="sans-serif" font-size="19">Three shelves:</text><text x="665" y="212" fill="#18232c" font-family="sans-serif" font-size="18">18", 40", 60" above floor</text><text x="665" y="270" fill="#18232c" font-family="sans-serif" font-size="19">Near-door V shelf:</text><text x="665" y="302" fill="#18232c" font-family="sans-serif" font-size="18">250 max depth; tip 190</text><text x="665" y="334" fill="#18232c" font-family="sans-serif" font-size="17">Ends before door opening</text><text x="665" y="400" fill="#18232c" font-family="sans-serif" font-size="19">Other side:</text><text x="665" y="432" fill="#18232c" font-family="sans-serif" font-size="18">590 deep for large totes</text><text x="665" y="494" fill="#18232c" font-family="sans-serif" font-size="19">After-door left shelves:</text><text x="665" y="526" fill="#18232c" font-family="sans-serif" font-size="18">350 deep for small gear</text><text x="665" y="590" fill="#18232c" font-family="sans-serif" font-size="17">Green: checked center aisle</text><text x="665" y="622" fill="#18232c" font-family="sans-serif" font-size="17">Red: door-entry keepout</text><text x="665" y="686" fill="#18232c" font-family="sans-serif" font-size="17">Yellow: large-tote allowance</text><text x="665" y="718" fill="#18232c" font-family="sans-serif" font-size="17">Not verified HDX dimensions</text><text x="35" y="986" fill="#18232c" font-family="sans-serif" font-size="17">Wire option: white wire decks and removable front rails on wooden uprights and bearers.</text><text x="35" y="1018" fill="#18232c" font-family="sans-serif" font-size="17">Plywood option: 18 mm decks on the same 38 x 64 mm wood frame.</text><text x="35" y="1062" fill="#18232c" font-family="sans-serif" font-size="17">CONCEPT ONLY: verify measurements, totes, joints, anchors, load capacity and door swing.</text></svg>