<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-label="Front V shelving plan and loading elevation"><rect x="0" y="0" width="1200" height="980" fill="white" /><text x="35" y="38" fill="#17212b" font-family="sans-serif" font-size="24">FRONT V SHELVING - TWO MATERIAL OPTIONS / SAME FIT</text><text x="35" y="66" fill="#17212b" font-family="sans-serif" font-size="15">CONCEPT ONLY - all dimensions in mm; tote envelopes are not product specifications</text><text x="35" y="100" fill="#17212b" font-family="sans-serif" font-size="18">PLAN - bottom tote shown; nose at top</text><polyline points="300.0,110.0 523.6,253.1 523.6,448.0 73.5,448.0 73.5,247.0 300.0,110.0" fill="none" stroke="#343f48" stroke-width="3" /><polygon points="262.3,151.6 337.7,151.6 510.6,260.8 510.6,390.8 240.2,390.8 240.2,297.2 86.8,297.2 86.8,255.6" fill="#dce6ee" stroke="#355469" stroke-width="2" /><rect x="254.5" y="233.5" width="208.0" height="140.4" fill="#f7db69" stroke="#655317" /><text x="250" y="315" fill="#17212b" font-family="sans-serif" font-size="14">27-gal TARGET</text><rect x="170.2" y="214.2" width="10" height="10" fill="#30373b" /><rect x="419.8" y="214.2" width="10" height="10" fill="#30373b" /><rect x="240.4" y="375.40000000000003" width="10" height="10" fill="#30373b" /><rect x="492.6" y="375.40000000000003" width="10" height="10" fill="#30373b" /><rect x="53.0" y="310.66202" width="179.14000000000001" height="239.74262000000002" fill="#ffdddd" fill-opacity="0.6" stroke="#a33" stroke-dasharray="6 4" /><text x="35" y="590" fill="#17212b" font-family="sans-serif" font-size="15">Red zone: 610 mm entry depth inside side wall.</text><text x="35" y="615" fill="#17212b" font-family="sans-serif" font-size="15">Notch keeps rack, totes and removal paths out of this zone.</text><text x="35" y="645" fill="#17212b" font-family="sans-serif" font-size="15">Four black squares: two nose-side + two loading-side uprights.</text><text x="35" y="675" fill="#17212b" font-family="sans-serif" font-size="15">Shelf rear edge: 1080 mm from nose; extension beyond V ~530 mm.</text><text x="650" y="100" fill="#17212b" font-family="sans-serif" font-size="18">LOADING ELEVATION - looking toward nose</text><line x1="640" y1="550" x2="1150" y2="550" stroke="#444" /><rect x="756.0" y="150.0" width="8" height="400.0" fill="#8a9298" /><rect x="996.0" y="150.0" width="8" height="400.0" fill="#8a9298" /><rect x="823.5" y="150.0" width="8" height="400.0" fill="#8a9298" /><rect x="1066.0" y="150.0" width="8" height="400.0" fill="#8a9298" /><rect x="675.0" y="524.6" width="407.5" height="5" fill="#b88954" /><rect x="675.0" y="384.9" width="407.5" height="5" fill="#b88954" /><rect x="675.0" y="257.90000000000003" width="407.5" height="5" fill="#b88954" /><rect x="836.25" y="424.6" width="200.0" height="100.0" fill="#414951" stroke="#222" /><rect x="836.25" y="424.6" width="200.0" height="4" fill="#f1cf3d" /><text x="846.25" y="474.6" fill="#17212b" font-family="sans-serif" font-size="14">27 gal</text><rect x="861.25" y="296.15" width="150.0" height="88.75" fill="#414951" stroke="#222" /><rect x="861.25" y="296.15" width="150.0" height="4" fill="#f1cf3d" /><text x="871.25" y="340.525" fill="#17212b" font-family="sans-serif" font-size="14">12 gal</text><rect x="837.5" y="181.65000000000003" width="100.0" height="76.25" fill="#414951" stroke="#222" /><rect x="837.5" y="181.65000000000003" width="100.0" height="4" fill="#f1cf3d" /><text x="847.5" y="219.77500000000003" fill="#17212b" font-family="sans-serif" font-size="14">7 gal</text><rect x="942.5" y="181.65000000000003" width="100.0" height="76.25" fill="#414951" stroke="#222" /><rect x="942.5" y="181.65000000000003" width="100.0" height="4" fill="#f1cf3d" /><text x="952.5" y="219.77500000000003" fill="#17212b" font-family="sans-serif" font-size="14">7 gal</text><text x="650" y="590" fill="#17212b" font-family="sans-serif" font-size="16">Shelf tops: 4", 26", 46" above floor.</text><text x="650" y="615" fill="#17212b" font-family="sans-serif" font-size="14">Elevation is schematic; plan notch is not visible here.</text><text x="35" y="740" fill="#17212b" font-family="sans-serif" font-size="19">VERSION 1 - WIRE SHELVES</text><text x="35" y="770" fill="#17212b" font-family="sans-serif" font-size="16">25.4 mm square tube concept; custom wire decks; front/rear bearers and rear X bracing.</text><text x="35" y="795" fill="#17212b" font-family="sans-serif" font-size="16">Unbranded concept. Custom wire decks follow the V and door notch; not an off-the-shelf rack.</text><text x="35" y="845" fill="#17212b" font-family="sans-serif" font-size="19">VERSION 2 - WOOD</text><text x="35" y="875" fill="#17212b" font-family="sans-serif" font-size="16">18 mm plywood decks; 38 x 64 mm posts/bearers; front/rear supports and rear X bracing.</text><text x="35" y="920" fill="#17212b" font-family="sans-serif" font-size="16">Yellow travel bars in CAD are removable restraint placeholders; joints and anchors need design.</text><text x="35" y="947" fill="#17212b" font-family="sans-serif" font-size="16">Physical measurements, actual tote fit and structural review are required before building.</text></svg>